cameras:
  - id: "cam_0"
    name: "Entrance"
    source: 0
    enabled: true

detection:
  model: "yolov8n.pt"
  # Slightly below high_conf_det_threshold so ByteTrack can recover occluded people
  # with mid-confidence boxes (two-stage association).
  confidence_threshold: 0.35
  device: "cpu"

tracking:
  method: "bytetrack"
  # ~1.8s grace at 25 FPS — keeps the same ID through brief shelf/person occlusions
  # so dwell visits are not fragmented.
  max_age: 45
  # Wait for a few confirmed hits before heatmap/dwell/analytics see the track.
  min_hits: 3
  frame_rate: 25.0
  # Only spawn tracks from solid detections (aligned with detector floor).
  track_activation_threshold: 0.4
  # ByteTrack internal maturity before a track survives a missed frame.
  minimum_consecutive_frames: 2
  # Slightly stricter than stock 0.1 to reduce ID swaps when people overlap.
  minimum_iou_threshold: 0.15
  # High/low split: >=0.5 first association; 0.35–0.5 recovers lost tracks.
  high_conf_det_threshold: 0.5
  default_zone_id: "entrance"

heatmap:
  floor_plan_path: "config/floor_plan/store_layout.png"
  resolution: [800, 600]
  blur_kernel_size: 51
  decay_factor: 0.995

storage:
  db_url: "sqlite:///data/heatmap.db"
  batch_write_interval_seconds: 1
  batch_write_max_events: 500

api:
  host: "0.0.0.0"
  port: 8000

auth:
  secret_key: "change-me-in-production"
  token_expire_minutes: 480

dashboard:
  api_base_url: "http://localhost:8000"
  refresh_interval_ms: 1000
